name: CHR beep

# NS-30: boot a real CHR under QEMU (quickchr), unlock `:beep` with the
# gdbstub RAM patch, transmit a v2 frame over the virtual PC speaker,
# and decode the capture with the offline codec. Deliberately a separate
# workflow from CI: it is slow (minutes) and needs QEMU+gdb, so it must
# not gate Pages deployment (NS-21) or the required-jobs list.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chr-beep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install QEMU and gdb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils gdb
      - run: bun install --frozen-lockfile
      - run: bun run test:chr
      - name: Keep CHR capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-beep
          path: .scratch/chr-beep/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
