name: Pages (live decoder + WAV harness)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build harness bundle and assemble site
        run: |
          mkdir -p _site
          bun build web/wav-entry.ts --target browser --outfile _site/wav-decode.js
          cp live.html _site/index.html
          cp live.html _site/live.html
          cp harness.html _site/harness.html
          cp encode/enbeep-frame.rsc _site/enbeep-frame.rsc
          cp docs/SPEC.md _site/SPEC.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
